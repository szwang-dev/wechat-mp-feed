<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">wechat-mp-feed 三层结构</title>
  <desc id="desc">展示 feed 基础层、语义配置层和应用输出层之间的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#24292f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fffdf8; }
      .title { font: 700 28px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .subtitle { font: 500 15px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #57606a; }
      .layerTitle { font: 800 22px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .label { font: 700 16px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2328; }
      .small { font: 500 13px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #57606a; }
      .band { stroke: #24292f; stroke-width: 2.4; filter: url(#shadow); }
      .box { stroke: #24292f; stroke-width: 1.8; }
      .rough { fill: none; stroke: #24292f; stroke-width: 1.1; opacity: .50; }
      .arrow { fill: none; stroke: #24292f; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .note { font: 700 15px "Inter", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6e4f00; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="500" rx="24"/>
  <text x="54" y="56" class="title">三层结构：通用 feed 层 + 可替换语义层 + 应用输出</text>
  <text x="54" y="84" class="subtitle">金融投研是内置领域包；分类、标签、评分规则和应用目标可以按实际研究目标调整。</text>

  <g transform="translate(54 122)">
    <rect class="band" x="0" y="0" width="1012" height="96" rx="22" fill="#e8f1ff"/>
    <path class="rough" d="M12 10 C240 0,760 4,1000 12 M1006 28 C1015 56,1012 78,999 88 M990 93 C744 103,260 99,13 88 M6 76 C-2 46,2 22,12 10"/>
    <text x="28" y="38" class="layerTitle">Feed 基础层</text>
    <text x="28" y="66" class="small">稳定接入与本地沉淀</text>

    <g transform="translate(260 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">来源库</text>
    </g>
    <g transform="translate(430 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">文章元数据</text>
    </g>
    <g transform="translate(600 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">正文与图片</text>
    </g>
    <g transform="translate(770 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">SQLite</text>
    </g>
  </g>

  <g transform="translate(54 246)">
    <rect class="band" x="0" y="0" width="1012" height="96" rx="22" fill="#fff1e5"/>
    <path class="rough" d="M12 9 C248 1,764 2,1001 11 M1006 27 C1016 54,1011 78,998 88 M989 93 C748 101,262 99,13 88 M7 77 C-1 48,3 21,12 9"/>
    <text x="28" y="38" class="layerTitle">语义配置层</text>
    <text x="28" y="66" class="small">解释来源和文章价值</text>

    <g transform="translate(260 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">分类体系</text>
    </g>
    <g transform="translate(430 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">标签属性</text>
    </g>
    <g transform="translate(600 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">评分规则</text>
    </g>
    <g transform="translate(770 23)">
      <rect class="box" x="0" y="0" width="142" height="50" rx="14" fill="#ffffff"/>
      <text x="71" y="31" text-anchor="middle" class="label">LLM 任务</text>
    </g>
  </g>

  <g transform="translate(54 370)">
    <rect class="band" x="0" y="0" width="1012" height="86" rx="22" fill="#e6ffec"/>
    <path class="rough" d="M12 9 C248 1,764 2,1001 11 M1006 26 C1015 51,1010 70,998 78 M989 84 C748 91,262 88,13 78 M7 68 C-1 43,3 20,12 9"/>
    <text x="28" y="36" class="layerTitle">应用输出层</text>
    <text x="28" y="63" class="small">生成下游工作流结果</text>

    <g transform="translate(260 18)">
      <rect class="box" x="0" y="0" width="150" height="50" rx="14" fill="#ffffff"/>
      <text x="75" y="31" text-anchor="middle" class="label">摘要包</text>
    </g>
    <g transform="translate(438 18)">
      <rect class="box" x="0" y="0" width="150" height="50" rx="14" fill="#ffffff"/>
      <text x="75" y="31" text-anchor="middle" class="label">摘要上下文</text>
    </g>
    <g transform="translate(616 18)">
      <rect class="box" x="0" y="0" width="150" height="50" rx="14" fill="#ffffff"/>
      <text x="75" y="31" text-anchor="middle" class="label">报告 / 提醒</text>
    </g>
    <g transform="translate(794 18)">
      <rect class="box" x="0" y="0" width="150" height="50" rx="14" fill="#ffffff"/>
      <text x="75" y="31" text-anchor="middle" class="label">策略池</text>
    </g>
  </g>

  <path class="arrow" d="M560 222 C560 229,560 235,560 242"/>
  <path class="arrow" d="M560 346 C560 353,560 360,560 366"/>
  <text x="846" y="88" class="note">内置：金融投研领域包</text>
</svg>
